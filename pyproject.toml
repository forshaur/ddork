[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddork"
version = "1.0.3"
description = "new and (less|un)known bug-bounty program discovery tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich",
    "curl-cffi",
    "beautifulsoup4",
    "ddgs",
    "tldextract"
]

[project.scripts]
ddork = "ddork.cli:run"

[tool.setuptools]
packages = ["ddork", "ddork.competitors", "ddork.sources"]
